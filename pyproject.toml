[project]
name = "chrome-enumerator"
version = "0.1.0"
description = "Static macOS scanner for probable runnable Chromium-family runtime cores"
authors = [
    { name = "Po1ynomial", email = "polynomial1@foxmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
chrome-enumerator = "chrome_enumerator:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
