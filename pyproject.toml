[project]
name = "chromium-enumerator"
version = "0.2.0"
description = "Static filesystem scanner for probable runnable Chromium-family runtime cores (macOS and Windows)"
requires-python = ">=3.14"
authors = [{ name = "Po1ynomial", email = "polynomial1@foxmail.com" }]
dependencies = []

[project.scripts]
chromium-count = "chromium_enumerator:main"

[project.optional-dependencies]
windows-metadata = ["pefile>=2023.2.7"]

[dependency-groups]
dev = [
  "basedpyright>=1.40.1",
  "pytest>=9.0.3",
  "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.ruff]
target-version = "py314"
